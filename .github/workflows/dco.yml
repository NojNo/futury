name: dco
on:
  pull_request:
permissions:
  contents: read
jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries the author's Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format=%B "$c" | git interpret-trailers --parse | grep -Fxq "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is missing 'Signed-off-by: $author'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with 'git commit -s' (see CONTRIBUTING.md)."
            echo "To fix existing commits: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
